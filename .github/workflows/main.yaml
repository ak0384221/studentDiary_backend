name: CI/CD

on:
  push:
    branches: [main]

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: get-code
        uses: actions/checkout@v4

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install dep
        run: pnpm install --frozen-lockfile

      - name: type check
        run: pnpm run typecheck

      - name: build
        run: pnpm run build

      - name: upload-build-artfact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist
            package.json
            pnpm-lock.yaml
          retention-days: 1

  docker-build-push:
    runs-on: ubuntu-latest
    steps:
      - name: get-code
        uses: actions/checkout@v4

      - name: download artfact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .

